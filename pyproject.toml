[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerebro-memory"
version = "1.0.0"
description = "An autonomic AI memory system for Cursor and Claude Code."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Shubham Avhad" },
]
dependencies = [
    "click>=8.1",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
viz = [
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cerebro = "cerebro.interface.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/cerebro"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
